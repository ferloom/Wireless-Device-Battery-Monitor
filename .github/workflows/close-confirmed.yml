# Issues waiting for the reporter are labelled "awaiting-confirmation" instead of being closed.
# - A comment from anyone but the maintainer removes the label at once, and reopens the issue if it
#   was closed.
# - 24 hours after the label was added with no such reply, the issue is closed: as "not planned"
#   when it is also labelled "unsupported" or "duplicate", else as "completed".
name: Close unanswered issues

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  reply:
    if: >-
      github.event_name == 'issue_comment' &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login != github.repository_owner &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Remove the label, reopen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          N: ${{ github.event.issue.number }}
          STATE: ${{ github.event.issue.state }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          if [[ ",$LABELS," == *",awaiting-confirmation,"* ]]; then
            gh issue edit "$N" --repo "$REPO" --remove-label awaiting-confirmation
            echo "#$N: label removed"
          fi
          if [ "$STATE" = "closed" ]; then
            gh issue reopen "$N" --repo "$REPO"
            echo "#$N: reopened"
          fi

  close:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - name: Close or keep labelled issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          LABEL: awaiting-confirmation
          OWNER: ${{ github.repository_owner }}
        run: |
          now=$(date -u +%s)
          for n in $(gh issue list --repo "$REPO" --label "$LABEL" --state open --limit 500 --json number -q '.[].number'); do
            # --paginate runs the filter per page, so take the last line / count lines.
            labelled=$(gh api "repos/$REPO/issues/$n/events" --paginate \
              -q ".[] | select(.event == \"labeled\" and .label.name == \"$LABEL\") | .created_at" | tail -n 1)
            [ -z "$labelled" ] && continue
            replies=$(gh api "repos/$REPO/issues/$n/comments" --paginate \
              -q ".[] | select(.created_at > \"$labelled\" and .user.login != \"$OWNER\" and .user.type != \"Bot\") | .id" | wc -l)
            if [ "${replies:-0}" -gt 0 ]; then
              gh issue edit "$n" --repo "$REPO" --remove-label "$LABEL"
              echo "#$n: reply received, kept open"
              continue
            fi
            age=$(( now - $(date -u -d "$labelled" +%s) ))
            if [ "$age" -ge 86400 ]; then
              reason=completed
              if gh issue view "$n" --repo "$REPO" --json labels -q '.labels[].name' | grep -qx 'unsupported\|duplicate'; then
                reason="not planned"
              fi
              gh issue close "$n" --repo "$REPO" --reason "$reason" \
                --comment "Closing automatically: no reply within 24 hours. If something still doesn't work, just comment here and it reopens."
              echo "#$n: closed ($reason)"
            fi
          done
